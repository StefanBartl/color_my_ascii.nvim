name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ plugin/ TESTS/

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run luacheck
        uses: lunarmodules/luacheck@v1.2.0
        with:
          args: lua/ plugin/ TESTS/

  tests:
    name: tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: color_my_ascii.nvim

      # lib.nvim is a runtime dependency (debounce_manager), checked out as a
      # sibling -- the layout TESTS/run.lua's own resolver looks for after
      # $LIB_NVIM_PATH.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run TESTS/run.lua
        working-directory: color_my_ascii.nvim
        run: nvim --headless -u NONE -c "set rtp+=." -l TESTS/run.lua
